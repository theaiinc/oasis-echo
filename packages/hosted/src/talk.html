<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Echo</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #667085; --line: #e3e6eb;
    --accent: #3b5bdb; --accent-text: #ffffff; --me: #eef2ff; --live: #e03131; --note: #fff8e6; --note-line: #f2d98a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e8eaef; --muted: #8a93a6; --line: #262b36;
      --accent: #748ffc; --accent-text: #0f1115; --me: #1d2433; --live: #ff6b6b; --note: #2a2415; --note-line: #5c4a1c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 6em; }
  select { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 14px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--me); border-color: transparent; }
  .msg.note { background: var(--note); border-color: var(--note-line); font-size: 14px; }
  .msg.note b { display: block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin: auto 0; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; text-align: center; }
  #call { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text); font: 650 15px/1 inherit; cursor: pointer; }
  #call.on { background: var(--live); }
  #call.speaking { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .row { display: flex; gap: 8px; width: 100%; }
  #text { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1 id="title">Echo</h1>
  <select id="agent" aria-label="Who to talk to" hidden></select>
  <select id="lang" aria-label="Language">
    <option value="en-US">English</option>
    <option value="vi-VN">Tiếng Việt</option>
  </select>
</header>
<div id="log"><p class="hint" id="hint">Tap Call and just talk. You can interrupt any time.</p></div>
<footer>
  <div id="status"></div>
  <button id="call" aria-label="Start call">Call</button>
  <div class="row">
    <input id="text" placeholder="…or type" autocomplete="off" enterkeyhint="send">
  </div>
  <label id="sttrow" hidden><input type="checkbox" id="serverstt"> Server listening (English)</label>
</footer>
<script type="importmap">
  { "imports": {
      "@oasis-echo/sdk": "/sdk/index.js",
      "@oasis-echo/sdk/browser": "/sdk/browser/index.js",
      "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.1.0"
  } }
</script>
<script type="module">
  import { OasisClient } from '@oasis-echo/sdk';
  import { VoiceSession } from '@oasis-echo/sdk/browser';

  const $ = (id) => document.getElementById(id);
  const log = $('log'), status = $('status'), call = $('call'), agentSel = $('agent'), langSel = $('lang');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let client = null, voice = null, agent = null;
  const bubbles = new Map();

  function add(text, cls, label) {
    $('hint')?.remove();
    const el = document.createElement('div');
    el.className = `msg ${cls}`;
    if (label) { const b = document.createElement('b'); b.textContent = label; el.appendChild(b); el.appendChild(document.createTextNode(text)); }
    else el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function connect(a) {
    voice?.stop(); client?.close();
    bubbles.clear();
    agent = a;
    $('title').textContent = a.expert ? `${a.name} · ${a.project}` : a.name;
    client = new OasisClient({ baseUrl: `/a/${a.id}` });
    client.on('user.input', (p) => add(p.text, 'me'));
    client.on('tts.chunk', (p) => {
      if (p.filler || !p.text) return;
      let el = bubbles.get(p.turnId);
      if (!el) { el = add('', 'agent'); bubbles.set(p.turnId, el); }
      if (!el.textContent.includes(p.text)) el.textContent = (el.textContent ? el.textContent + ' ' : '') + p.text;
      log.scrollTop = log.scrollHeight;
    });
    client.on('expert.answer', (p) => {
      add(p.answer || p.error || '', 'note', p.status === 'done' ? `${p.expert} answered: ${p.question}` : `${p.expert} couldn't answer`);
    });
    client.on('error', (p) => { if (p.source === 'sse') status.textContent = 'Reconnecting…'; });
    client.connect();
    voice = new VoiceSession({
      client,
      baseUrl: `/a/${a.id}`,
      emotion: false,
      serverStt: $('serverstt').checked && langSel.value === 'en-US',
      lang: langSel.value,
    });
    voice.on('hint', (h) => { status.textContent = h.text; });
    voice.on('speakingChange', (on) => call.classList.toggle('speaking', on));
    voice.on('error', (e) => { status.textContent = e.kind === 'mic' ? 'Allow the microphone to talk.' : e.message; });
    voice.on('started', () => { call.classList.add('on'); call.textContent = 'End'; call.setAttribute('aria-label', 'End call'); });
    voice.on('stopped', () => { call.classList.remove('on', 'speaking'); call.textContent = 'Call'; call.setAttribute('aria-label', 'Start call'); status.textContent = ''; });
  }

  call.addEventListener('click', () => { if (voice?.isRunning) voice.stop(); else voice?.start(); });
  $('text').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    client?.sendTurn({ text: e.target.value.trim() }).catch(() => {});
    e.target.value = '';
  });
  langSel.value = store.get('echo.lang') || (navigator.language?.startsWith('vi') ? 'vi-VN' : 'en-US');
  const rebuild = () => { const running = voice?.isRunning; connect(agent); if (running) voice.start(); };
  langSel.addEventListener('change', () => { store.set('echo.lang', langSel.value); rebuild(); });
  $('serverstt').addEventListener('change', (e) => { store.set('echo.serverstt', e.target.checked ? '1' : '0'); rebuild(); });
  $('serverstt').checked = store.get('echo.serverstt') === '1';

  const res = await fetch('/api/me');
  if (res.status === 401) location.href = '/auth/login';
  const me = await res.json();
  $('sttrow').hidden = !me.serverStt;
  if (!me.agents?.length) { add(`${me.email} has no agents to talk to yet.`, 'note'); call.disabled = true; }
  else {
    for (const a of me.agents) agentSel.add(new Option(`${a.name} · ${a.project}`, a.id));
    agentSel.hidden = me.agents.length < 2;
    const saved = store.get('echo.agent');
    const first = me.agents.find((a) => a.id === saved) ?? me.agents[0];
    agentSel.value = first.id;
    agentSel.addEventListener('change', () => { store.set('echo.agent', agentSel.value); connect(me.agents.find((a) => a.id === agentSel.value)); });
    connect(first);
  }
</script>
</body>
</html>

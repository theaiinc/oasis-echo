name: Windows App – build

# Builds the Windows tray app and runs the portable core's tests on a
# Windows runner for every change under apps/windows.

on:
  push:
    branches: [main]
    paths: ['apps/windows/**', '.github/workflows/windows-*.yml']
  pull_request:
    paths: ['apps/windows/**', '.github/workflows/windows-*.yml']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test tests/OasisEcho.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/OasisEcho -c Release

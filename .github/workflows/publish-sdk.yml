name: Publish SDKs to npm

# A release tagged sdk-vX.Y.Z publishes @theaiinc/oasis-echo-sdk and @theaiinc/oasis-echo-expo at X.Y.Z,
# with npm trusted publishing (GitHub OIDC, no stored token), the same way as @theaiinc/aegis-sdk. Each package needs
# this repo + workflow (+ environment "release") set as its trusted publisher on npmjs.com.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    if: startsWith(github.event.release.tag_name, 'sdk-v')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#sdk-v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid semver: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install, build, test
        run: |
          npm ci
          npx tsc -b packages/sdk packages/expo
          npx vitest run packages/sdk packages/expo

      - name: Set versions
        run: |
          for p in packages/sdk packages/expo; do
            (cd "$p" && npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version)
          done

      - name: Publish (trusted publishing)
        run: |
          JWT=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")
          for pair in "sdk:@theaiinc%2foasis-echo-sdk" "expo:@theaiinc%2foasis-echo-expo"; do
            dir="packages/${pair%%:*}"
            pkg="${pair#*:}"
            TOKEN=$(curl -sS -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg" \
              -H "Authorization: Bearer $JWT" \
              | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
            echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
            (cd "$dir" && npm publish --access public)
          done
          rm -f ~/.npmrc
